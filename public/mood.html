<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дневник мыслей</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui; background: linear-gradient(145deg, #ffe4f0 0%, #b8e1fc 100%); padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 32px; padding: 25px; }
        .navbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; }
        .nav-links { display: flex; gap: 15px; }
        .nav-links a { text-decoration: none; color: #c2417c; background: rgba(255,255,255,0.7); padding: 5px 15px; border-radius: 40px; }
        .btn { background: linear-gradient(135deg, #ec489a, #f472b6); color: white; border: none; padding: 10px 20px; border-radius: 60px; cursor: pointer; }
        h1 { text-align: center; margin-bottom: 20px; color: #c2417c; }
        .emoji-panel { display: flex; gap: 10px; justify-content: center; margin: 20px 0; flex-wrap: wrap; }
        .mood-btn { font-size: 2rem; background: white; border: 2px solid #f472b6; border-radius: 60px; padding: 10px; cursor: pointer; }
        .mood-history { background: #fef2f8; border-radius: 20px; padding: 15px; margin-top: 20px; max-height: 300px; overflow-y: auto; }
        .mood-entry { border-bottom: 1px solid #fbcfe8; padding: 8px 0; }
        .creator-section { text-align: center; margin-top: 30px; padding: 15px; background: #ffe0ef; border-radius: 40px; }
        input { width: 100%; padding: 12px; border-radius: 60px; border: 1px solid #fbcfe8; margin: 10px 0; }
        .user-info { background: #fff0f7; padding: 5px 15px; border-radius: 40px; display: inline-flex; align-items: center; gap: 10px; }
        .logout-btn { background: none; border: none; color: #ec489a; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <div class="navbar">
        <div class="logo">🌸 СИСТЕМНЫЙ КОНТРОЛЬ</div>
        <div class="nav-links">
            <a href="/">Главная</a>
            <a href="/mood.html">Дневник</a>
            <a href="/chat.html">LIVE-комнаты</a>
            <a href="/team.html">Команда</a>
        </div>
        <div id="userInfo"></div>
    </div>

    <h1>📔 Дневник мыслей</h1>
    
    <div class="emoji-panel">
        <button class="mood-btn" data-mood="😞">😞</button>
        <button class="mood-btn" data-mood="😐">😐</button>
        <button class="mood-btn" data-mood="🙂">🙂</button>
        <button class="mood-btn" data-mood="😄">😄</button>
        <button class="mood-btn" data-mood="🔥">🔥</button>
    </div>
    
    <input type="text" id="thoughtInput" placeholder="Что у тебя на уме?">
    <button id="saveBtn" class="btn" style="width:100%;">➕ Добавить запись</button>
    
    <h3 style="margin-top:20px;">📜 История</h3>
    <div class="mood-history" id="history"></div>
</div>

<div class="container" style="margin-top:20px;"><div class="creator-section">🕶️ Создатели: «SECRET ROOM SQUAD»</div></div>

<script>
    // Получаем email пользователя из localStorage
    const currentUser = localStorage.getItem('currentUserEmail');
    const userInfoDiv = document.getElementById('userInfo');
    
    // Проверка авторизации
    if (!currentUser) {
        userInfoDiv.innerHTML = '<a href="/" style="color:#ec489a;">Войти</a>';
        alert('Сначала войдите в аккаунт!');
        window.location.href = '/';
    } else {
        userInfoDiv.innerHTML = `
            <div class="user-info">
                👤 ${currentUser.split('@')[0]}
                <button id="logoutBtn" class="logout-btn">Выйти</button>
            </div>
        `;
        document.getElementById('logoutBtn')?.addEventListener('click', () => {
            localStorage.removeItem('currentUserEmail');
            window.location.href = '/';
        });
    }
    
    // Дневник
    function escapeHtml(str) { return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m]); }
    
    let entries = JSON.parse(localStorage.getItem('moodEntries')) || [];
    const historyDiv = document.getElementById('history');
    const thoughtInput = document.getElementById('thoughtInput');
    
    function render() {
        historyDiv.innerHTML = '';
        if (entries.length === 0) {
            historyDiv.innerHTML = '<div class="mood-entry">📭 Нет записей</div>';
            return;
        }
        entries.slice(0, 20).forEach(e => {
            const div = document.createElement('div');
            div.className = 'mood-entry';
            div.innerHTML = `<strong>${e.time}</strong> ${e.mood} — ${escapeHtml(e.text || '—')}`;
            historyDiv.appendChild(div);
        });
    }
    
    document.querySelectorAll('.mood-btn').forEach(btn => {
        btn.onclick = () => {
            const mood = btn.getAttribute('data-mood');
            const text = thoughtInput.value.trim();
            const time = new Date().toLocaleString();
            entries.unshift({ time, mood, text: text || '—' });
            if (entries.length > 30) entries.pop();
            localStorage.setItem('moodEntries', JSON.stringify(entries));
            render();
            thoughtInput.value = '';
        };
    });
    
    document.getElementById('saveBtn').onclick = () => {
        const text = thoughtInput.value.trim();
        if (!text) { alert('Напиши мысль'); return; }
        const time = new Date().toLocaleString();
        entries.unshift({ time, mood: '📝', text });
        if (entries.length > 30) entries.pop();
        localStorage.setItem('moodEntries', JSON.stringify(entries));
        render();
        thoughtInput.value = '';
    };
    
    render();
</script>
</body>
</html>
