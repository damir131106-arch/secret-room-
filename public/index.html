<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Системный контроль</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: system-ui; background: linear-gradient(145deg, #ffe4f0, #b8e1fc); margin: 0; padding: 20px; text-align: center; }
        .btn { background: #ec489a; color: white; border: none; padding: 10px 20px; border-radius: 60px; cursor: pointer; margin: 5px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-content { background: white; border-radius: 48px; padding: 20px; max-width: 400px; width: 90%; }
        input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 60px; border: 1px solid #fbcfe8; }
        .message { color: #db2777; margin-top: 10px; }
        .close-modal { float: right; cursor: pointer; font-size: 24px; }
    </style>
</head>
<body>

<h1>СИСТЕМНЫЙ КОНТРОЛЬ</h1>
<button id="showLoginBtn" class="btn">Войти</button>
<button id="showRegisterBtn" class="btn">Регистрация</button>

<!-- Модалка входа -->
<div id="loginModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" id="closeLoginModal">&times;</span>
        <h3>Вход</h3>
        <input type="email" id="loginEmail" placeholder="Email">
        <input type="password" id="loginPassword" placeholder="Пароль">
        <button id="doLoginBtn" class="btn">Войти</button>
        <div id="loginMessage" class="message"></div>
    </div>
</div>

<!-- Модалка регистрации -->
<div id="registerModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" id="closeRegisterModal">&times;</span>
        <h3>Регистрация</h3>
        <input type="text" id="regName" placeholder="Имя">
        <input type="text" id="regSurname" placeholder="Фамилия">
        <input type="email" id="regEmail" placeholder="Email">
        <input type="tel" id="regPhone" placeholder="Телефон">
        <input type="password" id="regPassword" placeholder="Пароль">
        <input type="password" id="regPasswordConfirm" placeholder="Повторите пароль">
        <div><input type="checkbox" id="regAgree"> <label>Я согласен с политикой</label></div>
        <button id="doRegisterBtn" class="btn">Зарегистрироваться</button>
        <div id="registerMessage" class="message"></div>
    </div>
</div>

<script>
    // Supabase инициализируется один раз и сразу
    const _supabase = window.supabase.createClient(
        'https://bajfklvkwzvsiuwbpzdy.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJhamZrbHZrd3p2c2l1d2JwemR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMzc4MDQsImV4cCI6MjA5MzgxMzgwNH0.CiX6PAqJIsdeox9350PTfzWXDqnNgaWspHkUrs8LUzE'
    );

    // Элементы
    const loginModal = document.getElementById('loginModal');
    const registerModal = document.getElementById('registerModal');
    
    document.getElementById('showLoginBtn').onclick = () => loginModal.classList.add('active');
    document.getElementById('showRegisterBtn').onclick = () => registerModal.classList.add('active');
    document.getElementById('closeLoginModal').onclick = () => loginModal.classList.remove('active');
    document.getElementById('closeRegisterModal').onclick = () => registerModal.classList.remove('active');
    
    // Регистрация
    document.getElementById('doRegisterBtn').onclick = async () => {
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;
        const confirm = document.getElementById('regPasswordConfirm').value;
        const agree = document.getElementById('regAgree').checked;
        const msgDiv = document.getElementById('registerMessage');
        
        if (!email || !password) { msgDiv.innerText = '❌ Заполните email и пароль'; return; }
        if (password !== confirm) { msgDiv.innerText = '❌ Пароли не совпадают'; return; }
        if (!agree) { msgDiv.innerText = '❌ Примите политику'; return; }
        
        const { error } = await _supabase.from('users').insert([{ 
            email, name: document.getElementById('regName').value, 
            surname: document.getElementById('regSurname').value, 
            phone: document.getElementById('regPhone').value, 
            password 
        }]);
        
        if (error) msgDiv.innerText = '❌ ' + error.message;
        else { msgDiv.innerText = '✅ Успех! Войдите.'; setTimeout(() => registerModal.classList.remove('active'), 1500); }
    };
    
    // Вход
    document.getElementById('doLoginBtn').onclick = async () => {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const msgDiv = document.getElementById('loginMessage');
        if (!email || !password) { msgDiv.innerText = '❌ Введите данные'; return; }
        
        const { data } = await _supabase.from('users').select('email').eq('email', email).eq('password', password);
        if (!data || data.length === 0) msgDiv.innerText = '❌ Неверный email или пароль';
        else { msgDiv.innerText = '✅ Вход выполнен!'; setTimeout(() => location.reload(), 1000); }
    };
</script>
</body>
</html>
