<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE-комнаты</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui; background: linear-gradient(145deg, #ffe4f0 0%, #b8e1fc 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; border-radius: 32px; padding: 25px; }
        .navbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; }
        .nav-links { display: flex; gap: 15px; flex-wrap: wrap; }
        .nav-links a { text-decoration: none; color: #c2417c; background: rgba(255,255,255,0.7); padding: 5px 15px; border-radius: 40px; }
        .btn { background: linear-gradient(135deg, #ec489a, #f472b6); color: white; border: none; padding: 12px 24px; border-radius: 60px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        .room-buttons { display: flex; gap: 15px; justify-content: center; margin: 20px 0; flex-wrap: wrap; }
        .room-info { background: #fce7f3; border-radius: 28px; padding: 15px; text-align: center; margin: 15px 0; font-size: 1.1rem; }
        .chat-area { background: #fef9fc; border-radius: 28px; padding: 15px; height: 350px; overflow-y: auto; border: 1px solid #fbcfe8; margin: 15px 0; }
        .message { background: white; padding: 10px 15px; border-radius: 20px; border-left: 4px solid #ec489a; margin-bottom: 10px; }
        .message strong { color: #c2417c; }
        .input-area { display: flex; gap: 10px; margin-top: 15px; }
        .input-area input { flex: 1; padding: 12px; border-radius: 60px; border: 1px solid #fbcfe8; font-size: 1rem; }
        .creator-section { text-align: center; margin-top: 20px; padding: 15px; background: #ffe0ef; border-radius: 40px; }
        .user-info { background: #fff0f7; padding: 5px 15px; border-radius: 40px; display: inline-flex; align-items: center; gap: 10px; }
        .logout-btn { background: none; border: none; color: #ec489a; cursor: pointer; font-weight: 600; }
        .status { text-align: center; padding: 8px; font-size: 0.85rem; color: #1e5e7e; }
        @media (max-width: 700px) { .room-buttons { flex-direction: column; } .btn { width: 100%; } }
    </style>
</head>
<body>
<div class="container">
    <div class="navbar">
        <div class="logo" style="font-weight:800; font-size:1.5rem;">🌸 СИСТЕМНЫЙ КОНТРОЛЬ</div>
        <div class="nav-links">
            <a href="/">Главная</a>
            <a href="/mood.html">Дневник</a>
            <a href="/chat.html">LIVE-комнаты</a>
            <a href="/team.html">Команда</a>
        </div>
        <div id="userInfo"></div>
    </div>

    <h1 style="text-align:center;">🎙️ LIVE-КОМНАТЫ</h1>
    <p style="text-align:center; color:#1e5e7e;">Создай комнату и делись кодом с друзьями</p>

    <div class="room-buttons">
        <button id="createRoomBtn" class="btn">✨ Создать комнату</button>
        <button id="joinRoomBtn" class="btn">🔑 Войти по коду</button>
    </div>
    
    <div id="roomInfo" class="room-info">💬 Ты не в комнате. Нажми "Создать комнату"</div>
    
    <div id="chatPanel" style="display:none;">
        <div style="background:#fef2f8; border-radius:60px; padding:12px; text-align:center; margin-bottom:15px;">
            <div id="roomCodeDisplay" style="font-weight:700; color:#db2777; font-size:1.2rem;">🔑 Код: ---</div>
            <div id="participantsCount" style="font-size:0.85rem; margin-top:5px;">👥 участников: 0</div>
            <button id="leaveRoomBtn" class="btn" style="margin-top:10px; padding:8px 20px;">🚪 Покинуть</button>
        </div>
        <div id="chatArea" class="chat-area">🔌 Подключение к серверу...</div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Напишите сообщение...">
            <button id="sendBtn" class="btn" style="padding:12px 20px;">📨 Отправить</button>
        </div>
    </div>
    <div id="wsStatus" class="status"></div>
</div>

<div class="container" style="margin-top:20px;"><div class="creator-section">🕶️ Создатели: «SECRET ROOM SQUAD»</div></div>

<script>
    // ===== ПРОВЕРКА АВТОРИЗАЦИИ =====
    const currentUserEmail = localStorage.getItem('currentUserEmail');
    const userInfoDiv = document.getElementById('userInfo');
    
    if (!currentUserEmail) {
        userInfoDiv.innerHTML = '<a href="/" style="color:#ec489a;">🔐 Войти</a>';
        document.getElementById('roomInfo').innerHTML = '⚠️ Сначала войдите в аккаунт на главной странице';
        document.getElementById('createRoomBtn').disabled = true;
        document.getElementById('joinRoomBtn').disabled = true;
    } else {
        userInfoDiv.innerHTML = `
            <div class="user-info">
                👤 ${currentUserEmail.split('@')[0]}
                <button id="logoutBtn" class="logout-btn">Выйти</button>
            </div>
        `;
        document.getElementById('logoutBtn')?.addEventListener('click', () => {
            localStorage.removeItem('currentUserEmail');
            window.location.href = '/';
        });
    }
    
    // ===== WEBSOCKET ЧАТ =====
    const wsUrl = window.location.protocol === 'https:' ? `wss://${window.location.host}` : `ws://${window.location.host}`;
    let ws = null;
    let currentRoom = null;
    const nickname = currentUserEmail ? currentUserEmail.split('@')[0] : 'Гость';
    
    function addMessageToChat(nick, text) {
        const chatDiv = document.getElementById('chatArea');
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message';
        msgDiv.innerHTML = `<strong>${escapeHtml(nick)}:</strong> ${escapeHtml(text)}`;
        chatDiv.appendChild(msgDiv);
        chatDiv.scrollTop = chatDiv.scrollHeight;
    }
    
    function addSystemMessageToChat(text) {
        const chatDiv = document.getElementById('chatArea');
        const msgDiv = document.createElement('div');
        msgDiv.style.textAlign = 'center';
        msgDiv.style.color = '#c2417c';
        msgDiv.style.fontSize = '0.8rem';
        msgDiv.style.margin = '8px 0';
        msgDiv.innerText = text;
        chatDiv.appendChild(msgDiv);
        chatDiv.scrollTop = chatDiv.scrollHeight;
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
    }
    
    function connectWebSocket() {
        const statusDiv = document.getElementById('wsStatus');
        statusDiv.innerHTML = '🟡 Подключение к серверу...';
        
        ws = new WebSocket(wsUrl);
        
        ws.onopen = () => {
            console.log('WebSocket подключен');
            statusDiv.innerHTML = '🟢 Соединение установлено';
        };
        
        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                console.log('Получено:', data);
                
                if (data.type === 'room_created') {
                    currentRoom = data.roomCode;
                    document.getElementById('roomInfo').style.display = 'none';
                    document.getElementById('chatPanel').style.display = 'block';
                    document.getElementById('roomCodeDisplay').innerHTML = `🔑 Код комнаты: ${currentRoom}`;
                    addSystemMessageToChat(`🎉 Комната создана! Код: ${currentRoom}. Передайте его друзьям!`);
                }
                else if (data.type === 'room_joined') {
                    if (data.success) {
                        currentRoom = data.roomCode;
                        document.getElementById('roomInfo').style.display = 'none';
                        document.getElementById('chatPanel').style.display = 'block';
                        document.getElementById('roomCodeDisplay').innerHTML = `🔑 Код комнаты: ${currentRoom}`;
                        addSystemMessageToChat(`✅ Вы вошли в комнату ${currentRoom}`);
                    } else {
                        document.getElementById('roomInfo').innerHTML = '❌ Комната не найдена. Проверьте код и попробуйте снова.';
                    }
                }
                else if (data.type === 'message') {
                    addMessageToChat(data.nickname, data.text);
                }
                else if (data.type === 'system') {
                    addSystemMessageToChat(data.text);
                }
                else if (data.type === 'participants') {
                    document.getElementById('participantsCount').innerHTML = `👥 участников: ${data.count}`;
                }
                else if (data.type === 'history' && data.data) {
                    const chatDiv = document.getElementById('chatArea');
                    chatDiv.innerHTML = '';
                    data.data.forEach(msg => addMessageToChat(msg.nickname, msg.text));
                    if (data.data.length === 0) addSystemMessageToChat('💬 Напишите первое сообщение!');
                }
            } catch(e) { console.error('Ошибка обработки:', e); }
        };
        
        ws.onerror = (error) => {
            console.error('WebSocket ошибка:', error);
            statusDiv.innerHTML = '🔴 Ошибка соединения';
        };
        
        ws.onclose = () => {
            console.log('WebSocket отключен, переподключение через 3 секунды...');
            statusDiv.innerHTML = '🔴 Соединение потеряно, переподключаемся...';
            setTimeout(connectWebSocket, 3000);
        };
    }
    
    // ===== КНОПКИ =====
    document.getElementById('createRoomBtn').onclick = () => {
        if (!currentUserEmail) {
            alert('Сначала войдите в аккаунт!');
            window.location.href = '/';
            return;
        }
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            alert('Подключение к серверу... Подождите секунду');
            connectWebSocket();
            setTimeout(() => {
                if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'create_room' }));
                else alert('Не удалось подключиться к серверу');
            }, 1000);
            return;
        }
        ws.send(JSON.stringify({ type: 'create_room' }));
    };
    
    document.getElementById('joinRoomBtn').onclick = () => {
        if (!currentUserEmail) {
            alert('Сначала войдите в аккаунт!');
            window.location.href = '/';
            return;
        }
        const code = prompt('Введите код комнаты (6 символов):');
        if (!code || !code.trim()) return;
        const roomCode = code.trim().toUpperCase();
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            connectWebSocket();
            setTimeout(() => {
                if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'join_room', roomCode }));
                else alert('Не удалось подключиться к серверу');
            }, 1000);
            return;
        }
        ws.send(JSON.stringify({ type: 'join_room', roomCode }));
    };
    
    document.getElementById('leaveRoomBtn').onclick = () => {
        currentRoom = null;
        document.getElementById('roomInfo').style.display = 'block';
        document.getElementById('chatPanel').style.display = 'none';
        document.getElementById('roomInfo').innerHTML = '💬 Ты не в комнате. Создай новую или войди по коду.';
    };
    
    document.getElementById('sendBtn').onclick = () => {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text) return;
        if (!currentRoom) {
            alert('Сначала создайте или войдите в комнату!');
            return;
        }
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            alert('Нет соединения с сервером');
            return;
        }
        ws.send(JSON.stringify({ type: 'message', nickname: nickname, text }));
        input.value = '';
    };
    
    document.getElementById('messageInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') document.getElementById('sendBtn').click();
    });
    
    // ===== ЗАПУСК =====
    connectWebSocket();
</script>
</body>
</html>
