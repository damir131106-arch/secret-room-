<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE-комнаты</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui; background: linear-gradient(145deg, #ffe4f0 0%, #b8e1fc 100%); padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; border-radius: 32px; padding: 25px; }
        .navbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; }
        .nav-links { display: flex; gap: 15px; }
        .nav-links a { text-decoration: none; color: #c2417c; background: rgba(255,255,255,0.7); padding: 5px 15px; border-radius: 40px; }
        .btn { background: linear-gradient(135deg, #ec489a, #f472b6); color: white; border: none; padding: 10px 20px; border-radius: 60px; cursor: pointer; }
        .room-buttons { display: flex; gap: 15px; justify-content: center; margin: 20px 0; }
        .room-info { background: #fce7f3; border-radius: 28px; padding: 15px; text-align: center; margin: 15px 0; }
        .chat-area { background: #fef9fc; border-radius: 28px; padding: 15px; height: 350px; overflow-y: auto; border: 1px solid #fbcfe8; margin: 15px 0; }
        .message { background: white; padding: 8px 15px; border-radius: 20px; border-left: 4px solid #ec489a; margin-bottom: 8px; }
        .input-area { display: flex; gap: 10px; margin-top: 15px; }
        .input-area input { flex: 1; padding: 12px; border-radius: 60px; border: 1px solid #fbcfe8; }
        .creator-section { text-align: center; margin-top: 20px; padding: 15px; background: #ffe0ef; border-radius: 40px; }
        .user-info { background: #fff0f7; padding: 5px 15px; border-radius: 40px; display: inline-flex; align-items: center; gap: 10px; }
        .logout-btn { background: none; border: none; color: #ec489a; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <div class="navbar">
        <div class="logo">🌸 СИСТЕМНЫЙ КОНТРОЛЬ</div>
        <div class="nav-links">
            <a href="/">Главная</a>
            <a href="/mood.html">Дневник</a>
            <a href="/chat.html">LIVE-комнаты</a>
            <a href="/team.html">Команда</a>
        </div>
        <div id="userInfo"></div>
    </div>

    <h1 style="text-align:center;">🎙️ LIVE-КОМНАТЫ</h1>
    <p style="text-align:center; color:#1e5e7e;">Создай комнату и делись кодом с друзьями</p>

    <div class="room-buttons">
        <button id="createRoomBtn" class="btn">✨ Создать комнату</button>
        <button id="joinRoomBtn" class="btn">🔑 Войти по коду</button>
    </div>
    
    <div id="roomInfo" class="room-info">💬 Ты не в комнате</div>
    
    <div id="chatPanel" style="display:none;">
        <div style="background:#fef2f8; border-radius:60px; padding:10px; text-align:center; margin-bottom:15px;">
            <div id="roomCodeDisplay" style="font-weight:700; color:#db2777;">Код: ---</div>
            <div id="participantsCount" style="font-size:0.8rem;">👥 участников: 0</div>
            <button id="leaveRoomBtn" class="btn" style="margin-top:10px; padding:5px 15px;">🚪 Покинуть</button>
        </div>
        <div id="chatArea" class="chat-area">🔌 Подключение...</div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Напишите сообщение...">
            <button id="sendBtn" class="btn">📨 Отправить</button>
        </div>
    </div>
</div>

<div class="container" style="margin-top:20px;"><div class="creator-section">🕶️ Создатели: «SECRET ROOM SQUAD»</div></div>

<script>
    // Проверка авторизации
    const currentUser = localStorage.getItem('currentUserEmail');
    const userInfoDiv = document.getElementById('userInfo');
    
    if (!currentUser) {
        userInfoDiv.innerHTML = '<a href="/" style="color:#ec489a;">Войти</a>';
        alert('Сначала войдите в аккаунт!');
        window.location.href = '/';
    } else {
        userInfoDiv.innerHTML = `
            <div class="user-info">
                👤 ${currentUser.split('@')[0]}
                <button id="logoutBtn" class="logout-btn">Выйти</button>
            </div>
        `;
        document.getElementById('logoutBtn')?.addEventListener('click', () => {
            localStorage.removeItem('currentUserEmail');
            window.location.href = '/';
        });
    }
    
    // WebSocket
    const wsUrl = window.location.protocol === 'https:' ? `wss://${window.location.host}` : `ws://${window.location.host}`;
    let ws = null;
    let currentRoom = null;
    
    function connectWebSocket() {
        ws = new WebSocket(wsUrl);
        ws.onopen = () => console.log('WebSocket подключен');
        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            if (data.type === 'room_created') {
                currentRoom = data.roomCode;
                document.getElementById('roomCodeDisplay').innerHTML = `Код: ${currentRoom}`;
                document.getElementById('roomInfo').style.display = 'none';
                document.getElementById('chatPanel').style.display = 'block';
                addSystemMessage(`🎉 Комната создана! Код: ${currentRoom}`);
            } else if (data.type === 'room_joined' && data.success) {
                currentRoom = data.roomCode;
                document.getElementById('roomCodeDisplay').innerHTML = `Код: ${currentRoom}`;
                document.getElementById('roomInfo').style.display = 'none';
                document.getElementById('chatPanel').style.display = 'block';
                addSystemMessage(`✅ Вы вошли в комнату ${currentRoom}`);
            } else if (data.type === 'room_joined' && !data.success) {
                document.getElementById('roomInfo').innerHTML = '💬 Комната не найдена';
            } else if (data.type === 'message') {
                addMessage(data.nickname, data.text);
            } else if (data.type === 'system') {
                addSystemMessage(data.text);
            } else if (data.type === 'participants') {
                document.getElementById('participantsCount').innerHTML = `👥 участников: ${data.count}`;
            } else if (data.type === 'history' && data.data) {
                document.getElementById('chatArea').innerHTML = '';
                data.data.forEach(msg => addMessage(msg.nickname, msg.text));
            }
        };
        ws.onclose = () => setTimeout(connectWebSocket, 2000);
    }
    
    function addMessage(nickname, text) {
        const div = document.createElement('div');
        div.className = 'message';
        div.innerHTML = `<strong>${escapeHtml(nickname)}:</strong> ${escapeHtml(text)}`;
        document.getElementById('chatArea').appendChild(div);
        div.scrollIntoView();
    }
    
    function addSystemMessage(text) {
        const div = document.createElement('div');
        div.style.textAlign = 'center';
        div.style.color = '#c2417c';
        div.style.fontSize = '0.8rem';
        div.style.margin = '10px 0';
        div.innerText = text;
        document.getElementById('chatArea').appendChild(div);
    }
    
    function escapeHtml(str) { return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>'： '&gt;' })[m]); }
    
    document.getElementById('createRoomBtn').onclick = () => {
        if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'create_room' }));
        else connectWebSocket();
    };
    
    document.getElementById('joinRoomBtn').onclick = () => {
        const code = prompt('Введите код комнаты:');
        if (code && ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'join_room', roomCode: code.toUpperCase() }));
        else connectWebSocket();
    };
    
    document.getElementById('leaveRoomBtn').onclick = () => {
        currentRoom = null;
        document.getElementById('roomInfo').style.display = 'block';
        document.getElementById('chatPanel').style.display = 'none';
        document.getElementById('roomInfo').innerHTML = '💬 Ты не в комнате';
    };
    
    document.getElementById('sendBtn').onclick = () => {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (text && ws && ws.readyState === WebSocket.OPEN && currentRoom) {
            ws.send(JSON.stringify({ type: 'message', nickname: currentUser.split('@')[0], text }));
            input.value = '';
        }
    };
    
    connectWebSocket();
</script>
</body>
</html>
