<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE-комнаты</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui; background: linear-gradient(145deg, #ffe4f0 0%, #b8e1fc 100%); padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; border-radius: 32px; padding: 25px; }
        .navbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; }
        .nav-links { display: flex; gap: 15px; flex-wrap: wrap; }
        .nav-links a { text-decoration: none; color: #c2417c; background: rgba(255,255,255,0.7); padding: 5px 15px; border-radius: 40px; }
        .streak-widget { background: linear-gradient(135deg, #fff0f7, #ffe4f0); border-radius: 60px; padding: 5px 18px; border: 1px solid #f472b6; display: inline-flex; align-items: center; gap: 10px; }
        .streak-days { font-size: 1.4rem; font-weight: 800; color: #db2777; }
        .streak-flame { animation: flameAnim 0.8s infinite; display: inline-block; }
        @keyframes flameAnim { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .btn { background: linear-gradient(135deg, #ec489a, #f472b6); color: white; border: none; padding: 12px 24px; border-radius: 60px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        .room-buttons { display: flex; gap: 15px; justify-content: center; margin: 20px 0; flex-wrap: wrap; }
        .room-info { background: #fce7f3; border-radius: 28px; padding: 15px; text-align: center; margin: 15px 0; font-size: 1.1rem; }
        .chat-area { background: #fef9fc; border-radius: 28px; padding: 15px; height: 350px; overflow-y: auto; border: 1px solid #fbcfe8; margin: 15px 0; }
        .message { background: white; padding: 10px 15px; border-radius: 20px; border-left: 4px solid #ec489a; margin-bottom: 10px; }
        .message strong { color: #c2417c; }
        .input-area { display: flex; gap: 10px; margin-top: 15px; }
        .input-area input { flex: 1; padding: 12px; border-radius: 60px; border: 1px solid #fbcfe8; font-size: 1rem; }
        .user-info { background: #fff0f7; padding: 5px 15px; border-radius: 40px; display: inline-flex; align-items: center; gap: 10px; }
        .logout-btn { background: none; border: none; color: #ec489a; cursor: pointer; font-weight: 600; }
        .creator-section { text-align: center; margin-top: 20px; padding: 15px; background: #ffe0ef; border-radius: 40px; }
        @media (max-width: 700px) { .navbar { flex-direction: column; } .room-buttons { flex-direction: column; } .btn { width: 100%; } }
    </style>
</head>
<body>
<div class="container">
    <div class="navbar">
        <div class="logo" style="font-weight:800; font-size:1.5rem;">🌸 СИСТЕМНЫЙ КОНТРОЛЬ</div>
        <div class="nav-links">
            <a href="/">Главная</a>
            <a href="/mood.html">Дневник</a>
            <a href="/chat.html">LIVE-комнаты</a>
            <a href="/team.html">Команда</a>
        </div>
        <div style="display: flex; align-items: center; gap: 15px;">
            <div id="streakWidget"></div>
            <div id="userInfo"></div>
        </div>
    </div>
    <h1 style="text-align:center;">🎙️ LIVE-КОМНАТЫ</h1>
    <p style="text-align:center; color:#1e5e7e;">Создай комнату и делись кодом с друзьями</p>
    <div class="room-buttons">
        <button id="createRoomBtn" class="btn">✨ Создать комнату</button>
        <button id="joinRoomBtn" class="btn">🔑 Войти по коду</button>
    </div>
    <div id="roomInfo" class="room-info">💬 Ты не в комнате. Нажми "Создать комнату"</div>
    <div id="chatPanel" style="display:none;">
        <div style="background:#fef2f8; border-radius:60px; padding:12px; text-align:center; margin-bottom:15px;">
            <div id="roomCodeDisplay" style="font-weight:700; color:#db2777; font-size:1.2rem;">🔑 Код: ---</div>
            <div id="participantsCount" style="font-size:0.85rem; margin-top:5px;">👥 участников: 0</div>
            <button id="leaveRoomBtn" class="btn" style="margin-top:10px; padding:8px 20px;">🚪 Покинуть</button>
        </div>
        <div id="chatArea" class="chat-area">🔌 Подключение к серверу...</div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Напишите сообщение...">
            <button id="sendBtn" class="btn">📨 Отправить</button>
        </div>
    </div>
    <div id="wsStatus" style="text-align:center; font-size:0.8rem; margin-top:10px; color:#1e5e7e;"></div>
</div>
<div class="container" style="margin-top:20px;"><div class="creator-section">🕶️ Создатели: «SECRET ROOM SQUAD»</div></div>

<script>
    // ===== МЫСЛЯП =====
    function updateStreak() {
        const today = new Date().toDateString();
        let data = JSON.parse(localStorage.getItem('streakWeasel')) || { streak: 0, lastVisit: null };
        let streak = data.streak;
        if (data.lastVisit === today) {}
        else if (data.lastVisit) {
            const lastDate = new Date(data.lastVisit);
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            if (lastDate.toDateString() === yesterday.toDateString()) streak++;
            else streak = 1;
        } else streak = 1;
        localStorage.setItem('streakWeasel', JSON.stringify({ streak, lastVisit: today }));
        return streak;
    }
    
    function displayStreak() {
        const streak = updateStreak();
        const container = document.getElementById('streakWidget');
        if (!container) return;
        let msg = streak === 1 ? 'Первый день Мысляпа!' : (streak < 3 ? 'Мысляп растёт!' : (streak < 7 ? 'Крепнет дисциплина!' : `Серия ${streak} дней!`));
        container.innerHTML = `<div class="streak-widget"><span>🧠✨</span><div><span class="streak-days">${streak}</span> <span style="font-size:0.7rem;">дней подряд</span> <span class="streak-flame">🔥</span><div style="font-size:0.65rem;">${msg}</div></div></div>`;
    }
    displayStreak();
    
    // ===== АВТОРИЗАЦИЯ =====
    const currentUserEmail = localStorage.getItem('currentUserEmail');
    const userInfoDiv = document.getElementById('userInfo');
    const nickname = currentUserEmail ? currentUserEmail.split('@')[0] : 'Гость';
    
    if (!currentUserEmail) {
        userInfoDiv.innerHTML = '<a href="/" style="color:#ec489a;">🔐 Войти</a>';
        alert('Сначала войдите в аккаунт!');
        window.location.href = '/';
    } else {
        userInfoDiv.innerHTML = `<div class="user-info">👤 ${nickname}<button id="logoutBtn" class="logout-btn">Выйти</button></div>`;
        document.getElementById('logoutBtn')?.addEventListener('click', () => { localStorage.removeItem('currentUserEmail'); location.href = '/'; });
    }
    
    // ===== WEBSOCKET =====
    const wsUrl = location.protocol === 'https:' ? `wss://${location.host}` : `ws://${location.host}`;
    let ws = null, currentRoom = null;
    
    function addMessage(nick, text) {
        const chatDiv = document.getElementById('chatArea');
        const div = document.createElement('div');
        div.className = 'message';
        div.innerHTML = `<strong>${escapeHtml(nick)}:</strong> ${escapeHtml(text)}`;
        chatDiv.appendChild(div);
        chatDiv.scrollTop = chatDiv.scrollHeight;
    }
    
    function addSystemMessage(text) {
        const chatDiv = document.getElementById('chatArea');
        const div = document.createElement('div');
        div.style.textAlign = 'center';
        div.style.color = '#c2417c';
        div.style.fontSize = '0.8rem';
        div.style.margin = '8px 0';
        div.innerText = text;
        chatDiv.appendChild(div);
        chatDiv.scrollTop = chatDiv.scrollHeight;
    }
    
    function escapeHtml(str) { return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m]); }
    
    function connect() {
        const statusDiv = document.getElementById('wsStatus');
        statusDiv.innerHTML = '🟡 Подключение...';
        ws = new WebSocket(wsUrl);
        ws.onopen = () => { statusDiv.innerHTML = '🟢 Соединение установлено'; };
        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            if (data.type === 'room_created') {
                currentRoom = data.roomCode;
                document.getElementById('roomInfo').style.display = 'none';
                document.getElementById('chatPanel').style.display = 'block';
                document.getElementById('roomCodeDisplay').innerHTML = `🔑 Код: ${currentRoom}`;
                addSystemMessage(`🎉 Комната создана! Код: ${currentRoom}`);
            } else if (data.type === 'room_joined' && data.success) {
                currentRoom = data.roomCode;
                document.getElementById('roomInfo').style.display = 'none';
                document.getElementById('chatPanel').style.display = 'block';
                document.getElementById('roomCodeDisplay').innerHTML = `🔑 Код: ${currentRoom}`;
                addSystemMessage(`✅ Вы вошли в комнату ${currentRoom}`);
            } else if (data.type === 'room_joined' && !data.success) {
                document.getElementById('roomInfo').innerHTML = '❌ Комната не найдена';
            } else if (data.type === 'message') {
                addMessage(data.nickname, data.text);
            } else if (data.type === 'system') {
                addSystemMessage(data.text);
            } else if (data.type === 'participants') {
                document.getElementById('participantsCount').innerHTML = `👥 участников: ${data.count}`;
            }
        };
        ws.onclose = () => { statusDiv.innerHTML = '🔴 Соединение потеряно, переподключаемся...'; setTimeout(connect, 3000); };
    }
    
    document.getElementById('createRoomBtn').onclick = () => {
        if (!ws || ws.readyState !== WebSocket.OPEN) { connect(); setTimeout(() => ws.send(JSON.stringify({ type: 'create_room' })), 1000); }
        else ws.send(JSON.stringify({ type: 'create_room' }));
    };
    
    document.getElementById('joinRoomBtn').onclick = () => {
        const code = prompt('Введите код комнаты:');
        if (!code) return;
        if (!ws || ws.readyState !== WebSocket.OPEN) { connect(); setTimeout(() => ws.send(JSON.stringify({ type: 'join_room', roomCode: code.toUpperCase() })), 1000); }
        else ws.send(JSON.stringify({ type: 'join_room', roomCode: code.toUpperCase() }));
    };
    
    document.getElementById('leaveRoomBtn').onclick = () => {
        currentRoom = null;
        document.getElementById('roomInfo').style.display = 'block';
        document.getElementById('chatPanel').style.display = 'none';
        document.getElementById('roomInfo').innerHTML = '💬 Ты не в комнате';
    };
    
    document.getElementById('sendBtn').onclick = () => {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text || !currentRoom || !ws || ws.readyState !== WebSocket.OPEN) return;
        ws.send(JSON.stringify({ type: 'message', nickname: nickname, text }));
        input.value = '';
    };
    
    document.getElementById('messageInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') document.getElementById('sendBtn').click(); });
    
    connect();
</script>
</body>
</html>
